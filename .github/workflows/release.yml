# Publish to npm when a version tag is pushed.
#
#   npm version minor            # bumps package.json + creates the v-tag
#   git push --follow-tags       # this workflow does the rest
#
# The full test suite, the drift guards and a real install of the packed tarball
# all run BEFORE publish — a broken build cannot reach the registry.
#
# Setup required once (see LAUNCH.md):
#   - repo secret NPM_TOKEN: an npm "Automation" access token
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Generated artifacts are in sync
        run: |
          npm run check:registry
          npm run check:schema
          npm run check:web
      - name: Test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Self-scan must stay clean
        run: node dist/cli/run.js src --blocking error
      - name: Pack, install the tarball into a clean project, and run it
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "packed: $TARBALL"
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" --silent
          # The binary must run from a real install, not from the source tree.
          npx node-doctor --version
          npx node-doctor diagnostics --json > /dev/null
          mkdir -p src && printf 'export const add = (a, b) => a + b;\n' > src/index.js
          npx node-doctor . --json > /dev/null
          echo "tarball verified"

  publish:
    name: publish
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing version $PKG"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to npm as \`@dhiravpatel/node-doctor@${GITHUB_REF_NAME#v}\`. See CHANGELOG.md for what changed." \
            --verify-tag
