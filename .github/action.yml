name: "node.doctor"
description: "Deterministic static analysis for Node.js backends, with PR baseline-delta (report only what the change introduced)."
author: "node.doctor"
branding:
  icon: "activity"
  color: "green"

inputs:
  directory:
    description: "Directory to scan."
    required: false
    default: "."
  blocking:
    description: "Exit policy applied to INTRODUCED findings only: error | warning | none."
    required: false
    default: "error"
  version:
    description: "node-doctor version to run (npm dist-tag or exact version)."
    required: false
    default: "latest"
  sarif-out:
    description: "Optional path to write a SARIF 2.1.0 report for code scanning upload."
    required: false
    default: ""
  github-token:
    description: "Token for PR comments, inline review, and commit status."
    required: false
    default: ${{ github.token }}
  comment:
    description: "Post/update a PR summary comment (and inline review). true | false."
    required: false
    default: "true"
  commit-status:
    description: "Publish a commit status with the health score. true | false."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Scan base branch (baseline, informational)
      shell: bash
      run: |
        set -e
        if [ -n "${{ github.base_ref }}" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          git checkout --detach "origin/${{ github.base_ref }}" 2>/dev/null \
            || git checkout --detach "${{ github.base_ref }}" || true
          npx --yes node-doctor@${{ inputs.version }} "${{ inputs.directory }}" \
            --json-out "$RUNNER_TEMP/baseline.json" --blocking none || true
          git checkout --detach "${{ github.sha }}" || true
        else
          echo '{"schemaVersion":2,"findings":[]}' > "$RUNNER_TEMP/baseline.json"
        fi

    - name: Scan head
      shell: bash
      run: |
        set -e
        ARGS=""
        if [ -n "${{ inputs.sarif-out }}" ]; then ARGS="--sarif-out ${{ inputs.sarif-out }}"; fi
        npx --yes node-doctor@${{ inputs.version }} "${{ inputs.directory }}" \
          --json-out "$RUNNER_TEMP/current.json" --blocking none $ARGS

    - name: Compute delta (introduced vs baseline)
      shell: bash
      run: |
        npx --yes node-doctor@${{ inputs.version }} delta \
          --baseline "$RUNNER_TEMP/baseline.json" \
          --current "$RUNNER_TEMP/current.json" \
          --blocking none --json > "$RUNNER_TEMP/delta.json"

    - name: PR summary comment
      if: ${{ inputs.comment == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        node "${{ github.action_path }}/scripts/render-comment.mjs" \
          "$RUNNER_TEMP/delta.json" "$RUNNER_TEMP/current.json" || true

    - name: Inline PR review
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        node "${{ github.action_path }}/scripts/post-review.mjs" "$RUNNER_TEMP/delta.json" || true

    - name: Commit status (health score)
      if: ${{ inputs.commit-status == 'true' && always() }}
      shell: bash
      run: |
        SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/current.json','utf8')).score.score)" 2>/dev/null || echo "")
        LABEL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/current.json','utf8')).score.label)" 2>/dev/null || echo "")
        if [ -z "$SCORE" ]; then exit 0; fi
        STATE=$(node -e "const d=JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/delta.json','utf8'));const b='${{ inputs.blocking }}';const f=d.introduced||[];let bad=false;if(b==='warning')bad=f.length>0;else if(b!=='none')bad=f.some(x=>x.severity==='error');console.log(bad?'failure':'success')" 2>/dev/null || echo "success")
        curl -sS -X POST \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
          -d "{\"state\":\"$STATE\",\"context\":\"node.doctor\",\"description\":\"Health $SCORE/100 ($LABEL)\"}" > /dev/null || true

    - name: Gate on introduced findings
      shell: bash
      run: |
        npx --yes node-doctor@${{ inputs.version }} delta \
          --baseline "$RUNNER_TEMP/baseline.json" \
          --current "$RUNNER_TEMP/current.json" \
          --blocking "${{ inputs.blocking }}"
